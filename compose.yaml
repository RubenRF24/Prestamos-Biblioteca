services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biblioteca}
      POSTGRES_USER: ${POSTGRES_USER:-biblioteca}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
    ports:
      # 5433 en el host para no chocar con un Postgres local en 5432. Overridable por env.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biblioteca}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025" # SMTP
      - "${MAILHOG_UI_PORT:-8025}:8025" # UI web (ver los correos enviados)

  backend:
    build: ./prestamosbiblioteca
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-biblioteca}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-biblioteca}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-biblioteca}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: "1025"
      # Secreto de desarrollo. En un despliegue real se inyecta por env y NO se versiona.
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please-32bytes-min-abcdefgh}
      # La demo corre sobre http local -> la cookie no puede ser Secure.
      APP_COOKIE_SECURE: "false"
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:4200}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@biblioteca.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-Admin123!}
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build: ./PrestamosBibliotecaFrontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4200}:80"

volumes:
  pgdata:
