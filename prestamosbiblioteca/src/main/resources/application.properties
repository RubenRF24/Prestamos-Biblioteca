spring.application.name=prestamosbiblioteca
# Perfil activo por defecto: dev. Override con SPRING_PROFILES_ACTIVE (docker usa prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Caffeine cache para el lookup de Open Library
spring.cache.type=caffeine
spring.cache.cache-names=openLibraryLookup
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=24h

server.port=8080

# ---- Configuracion de dominio de la aplicacion (defaults comunes) ----
# El secreto JWT NUNCA se sube al repo. En dev hay un default explicito de desarrollo;
# en prod es obligatorio via env (ver application-prod.properties).
app.security.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32bytes-min-abcdefgh}
app.security.jwt.expiration=${JWT_EXPIRATION:PT8H}
app.security.cookie.name=access_token
app.security.cookie.same-site=${APP_COOKIE_SAME_SITE:Strict}

app.loans.loan-days=14
app.loans.max-overdues=3
app.loans.overdue-window-days=90
app.loans.block-days=7

app.reservations.hold-hours=48

app.mail.from=${APP_MAIL_FROM:no-reply@biblioteca.local}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:4200}

# Usuario ADMIN de arranque (seeder idempotente). En prod override por env.
app.admin.name=${APP_ADMIN_NAME:Administrador}
app.admin.email=${APP_ADMIN_EMAIL:admin@biblioteca.local}
app.admin.password=${APP_ADMIN_PASSWORD:Admin123!}

app.openlibrary.base-url=${APP_OPENLIBRARY_BASE_URL:https://openlibrary.org}
app.openlibrary.covers-url=${APP_OPENLIBRARY_COVERS_URL:https://covers.openlibrary.org}
app.openlibrary.timeout=PT10S

springdoc.swagger-ui.path=/swagger-ui.html
