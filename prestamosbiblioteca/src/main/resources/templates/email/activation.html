<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, Helvetica, sans-serif; color:#1f2937; margin:0; padding:24px; background:#f3f4f6;">
  <div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px;">
    <h1 style="font-size:20px; margin:0 0 16px;">Activá tu cuenta</h1>
    <p>Hola <strong th:text="${name}">Nombre</strong>,</p>
    <p>Se creó una cuenta a tu nombre en la biblioteca para gestionar tu préstamo.
       Activala definiendo tu contraseña:</p>
    <p style="text-align:center; margin:24px 0;">
      <a th:href="${activationLink}" href="#"
         style="background:#2563eb; color:#ffffff; text-decoration:none; padding:12px 24px; border-radius:8px; display:inline-block;">
        Activar mi cuenta
      </a>
    </p>
    <p style="color:#6b7280; font-size:13px;">Si el botón no funciona, copiá y pegá este enlace:
       <span th:text="${activationLink}">https://...</span></p>
  </div>
</body>
</html>
