<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, Helvetica, sans-serif; color:#1f2937; margin:0; padding:24px; background:#f3f4f6;">
  <div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px;">
    <h1 style="font-size:20px; margin:0 0 16px;">Tu préstamo vence pronto</h1>
    <p>Hola <strong th:text="${borrowerName}">Nombre</strong>,</p>
    <p>El préstamo del libro <strong th:text="${bookTitle}">Título</strong> vence el
       <strong th:text="${dueDate}">15/01/2026</strong>.</p>
    <p style="color:#6b7280; font-size:13px;">Devolvelo a tiempo para evitar un atraso en tu cuenta.</p>
  </div>
</body>
</html>
