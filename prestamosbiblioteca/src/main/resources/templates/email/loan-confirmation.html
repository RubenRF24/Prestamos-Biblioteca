<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:24px;background:#efeadd;font-family:Georgia,'Segoe UI',Arial,sans-serif;color:#1d2b23;">
  <div style="max-width:560px;margin:0 auto;background:#f7f3e9;border:1px solid #d8cfbc;border-top:3px solid #c98a2b;border-radius:8px;padding:32px;">
    <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:15px;color:#24402f;letter-spacing:.02em;">📚 Biblioteca</p>
    <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:21px;color:#24402f;">Préstamo confirmado</h1>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#1d2b23;">Hola <strong th:text="${borrowerName}" style="color:#1d2b23;">Nombre</strong>,</p>
    <p style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#1d2b23;">Registramos tu préstamo del libro <strong th:text="${bookTitle}" style="color:#1d2b23;">Título</strong>.</p>
    <table style="width:100%;border-collapse:collapse;margin:16px 0;background:#f7f3e9;border:1px solid #d8cfbc;border-radius:8px;">
      <tr>
        <td style="padding:12px 16px;color:#6b6553;font-size:13px;border-bottom:1px solid #d8cfbc;">Fecha del préstamo</td>
        <td th:text="${loanDate}" style="padding:12px 16px;text-align:right;color:#1d2b23;font-size:14px;border-bottom:1px solid #d8cfbc;">01/01/2026</td>
      </tr>
      <tr>
        <td style="padding:12px 16px;color:#6b6553;font-size:13px;">Fecha límite de devolución</td>
        <td th:text="${dueDate}" style="padding:12px 16px;text-align:right;color:#1d2b23;font-size:14px;font-weight:bold;">15/01/2026</td>
      </tr>
    </table>
    <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#6b6553;">Recordá devolverlo antes de la fecha límite para evitar atrasos.</p>
  </div>
</body>
</html>
