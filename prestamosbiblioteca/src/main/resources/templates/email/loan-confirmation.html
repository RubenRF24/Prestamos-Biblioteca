<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, Helvetica, sans-serif; color:#1f2937; margin:0; padding:24px; background:#f3f4f6;">
  <div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px;">
    <h1 style="font-size:20px; margin:0 0 16px;">Préstamo confirmado</h1>
    <p>Hola <strong th:text="${borrowerName}">Nombre</strong>,</p>
    <p>Registramos tu préstamo del libro <strong th:text="${bookTitle}">Título</strong>.</p>
    <table style="width:100%; border-collapse:collapse; margin:16px 0;">
      <tr>
        <td style="padding:8px 0; color:#6b7280;">Fecha del préstamo</td>
        <td style="padding:8px 0; text-align:right;" th:text="${loanDate}">01/01/2026</td>
      </tr>
      <tr>
        <td style="padding:8px 0; color:#6b7280;">Fecha límite de devolución</td>
        <td style="padding:8px 0; text-align:right; font-weight:bold;" th:text="${dueDate}">15/01/2026</td>
      </tr>
    </table>
    <p style="color:#6b7280; font-size:13px;">Recordá devolverlo antes de la fecha límite para evitar atrasos.</p>
  </div>
</body>
</html>
