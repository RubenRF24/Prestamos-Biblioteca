<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:24px;background:#efeadd;font-family:Georgia,'Segoe UI',Arial,sans-serif;color:#1d2b23;">
  <div style="max-width:560px;margin:0 auto;background:#f7f3e9;border:1px solid #d8cfbc;border-top:3px solid #c98a2b;border-radius:8px;padding:32px;">
    <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:15px;color:#24402f;letter-spacing:.02em;">📚 Biblioteca</p>
    <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:21px;color:#a23b2e;">Cuenta bloqueada temporalmente</h1>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#1d2b23;">Hola <strong th:text="${name}" style="color:#1d2b23;">Nombre</strong>,</p>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#1d2b23;">Tu cuenta acumuló tres atrasos en los últimos 90 días, por lo que quedó bloqueada para pedir nuevos préstamos hasta <strong th:text="${blockedUntil}" style="color:#1d2b23;">22/01/2026 08:00</strong>.</p>
    <p style="margin:16px 0 0;font-size:13px;line-height:1.6;color:#6b6553;">Si necesitás que se levante antes, contactá a un administrador.</p>
  </div>
</body>
</html>
