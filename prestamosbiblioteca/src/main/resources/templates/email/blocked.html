<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="font-family: Arial, Helvetica, sans-serif; color:#1f2937; margin:0; padding:24px; background:#f3f4f6;">
  <div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:12px; padding:32px;">
    <h1 style="font-size:20px; margin:0 0 16px; color:#b91c1c;">Cuenta bloqueada temporalmente</h1>
    <p>Hola <strong th:text="${name}">Nombre</strong>,</p>
    <p>Tu cuenta acumuló tres atrasos en los últimos 90 días, por lo que quedó bloqueada para pedir
       nuevos préstamos hasta <strong th:text="${blockedUntil}">22/01/2026 08:00</strong>.</p>
    <p style="color:#6b7280; font-size:13px;">Si necesitás que se levante antes, contactá a un administrador.</p>
  </div>
</body>
</html>
