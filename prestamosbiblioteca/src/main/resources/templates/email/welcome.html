<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head><meta charset="UTF-8"/></head>
<body style="margin:0;padding:24px;background:#efeadd;font-family:Georgia,'Segoe UI',Arial,sans-serif;color:#1d2b23;">
  <div style="max-width:560px;margin:0 auto;background:#f7f3e9;border:1px solid #d8cfbc;border-top:3px solid #c98a2b;border-radius:8px;padding:32px;">
    <p style="margin:0 0 20px;font-family:Georgia,serif;font-size:15px;color:#24402f;letter-spacing:.02em;">📚 Biblioteca</p>
    <h1 style="margin:0 0 16px;font-family:Georgia,'Times New Roman',serif;font-size:21px;color:#24402f;">¡Tu cuenta está lista!</h1>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#1d2b23;">Hola <strong th:text="${name}" style="color:#1d2b23;">Nombre</strong>,</p>
    <p style="margin:0 0 12px;font-size:15px;line-height:1.6;color:#1d2b23;">Tu cuenta en la biblioteca fue creada correctamente. Ya podés iniciar sesión y empezar a pedir libros en préstamo.</p>
    <p style="text-align:center;margin:24px 0;">
      <a th:href="${loginLink}" href="#" style="background:#24402f;color:#ffffff;text-decoration:none;padding:12px 22px;border-radius:6px;display:inline-block;font-family:Georgia,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:bold;">Iniciar sesión</a>
    </p>
  </div>
</body>
</html>
