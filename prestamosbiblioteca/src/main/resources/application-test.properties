# Perfil TEST: el datasource lo provee Testcontainers via @ServiceConnection (no se define URL).
# El SMTP lo levanta GreenMail embebido en los tests que lo necesiten (puerto 3025).

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.mail.host=localhost
spring.mail.port=3025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.security.cookie.secure=false
app.security.jwt.secret=test-secret-test-secret-test-secret-test-secret-0123456789
