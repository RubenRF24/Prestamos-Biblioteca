# Perfil PROD: despliegue real. TODO viene de variables de entorno, sin defaults sensibles.
# El docker-compose usa este perfil y provee las envs (ver .env.example).

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS:false}

# El secreto JWT es OBLIGATORIO por env en prod (sin default -> falla si falta).
app.security.jwt.secret=${JWT_SECRET}

# Secure=true por defecto (requiere HTTPS). El docker-compose de demo corre sobre http,
# por eso alli se setea APP_COOKIE_SECURE=false explicitamente (documentado en README).
app.security.cookie.secure=${APP_COOKIE_SECURE:true}

spring.jpa.properties.hibernate.format_sql=false
