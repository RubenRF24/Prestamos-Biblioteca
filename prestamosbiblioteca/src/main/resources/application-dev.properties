# Perfil DEV: desarrollo local. Defaults apuntan a localhost (Postgres y MailHog locales
# o los del docker-compose mapeados a localhost). Todo overridable por env.

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biblioteca}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:biblioteca}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:biblioteca}

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# En local (http) la cookie NO puede ser Secure o el navegador la descarta.
app.security.cookie.secure=false

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.flywaydb=info
