name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend · tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Los tests de integración usan Testcontainers (Postgres); el runner ya trae Docker.
      - name: Run tests
        working-directory: prestamosbiblioteca
        run: ./mvnw -B test

  frontend-build:
    name: Frontend · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.16"
      - name: Install dependencies
        working-directory: PrestamosBibliotecaFrontend
        run: bun install --frozen-lockfile
      - name: Build
        working-directory: PrestamosBibliotecaFrontend
        run: bun run build

  publish-images:
    name: Publicar imágenes en GHCR
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Nombre del owner en minúsculas
        id: owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./prestamosbiblioteca
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/prestamos-biblioteca-backend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/prestamos-biblioteca-backend:${{ github.sha }}
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./PrestamosBibliotecaFrontend
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.value }}/prestamos-biblioteca-frontend:latest
            ghcr.io/${{ steps.owner.outputs.value }}/prestamos-biblioteca-frontend:${{ github.sha }}
